name: AI Coder

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task for the coding agent
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  implement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ftc-open-library/package-lock.json

      - name: Install project dependencies
        working-directory: ftc-open-library
        run: npm ci

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Create agent branch
        id: branch
        run: |
          BRANCH="agent/task-${GITHUB_RUN_ID}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          git config user.name "FTC AI Agent"
          git config user.email "agent@users.noreply.github.com"

      - name: Run coding agent
        working-directory: ftc-open-library
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          TASK: ${{ inputs.task }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "CURSOR_API_KEY is missing. Add it in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          agent -p "$(cat ../.ai/coder.md)

USER TASK:
$TASK"

      - name: Validate changes
        working-directory: ftc-open-library
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit and push
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "feat: implement AI coding task"
          git push origin "${{ steps.branch.outputs.branch }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "AI task: ${TASK}" \
            --body "Implemented by the AI coding workflow.\n\nOriginal task:\n${TASK}\n\nCI will run lint, typecheck, tests, and build. Review before merging."
